[project]
name = "AdaptivePlotter"
profile_version = 1

[paths]
control_dir = "@git-common/blackdog"
worktrees_dir = "../.worktrees"

[taxonomy]
validation_commands = ["make docs-check", "make quick-test", "git diff --check"]
doc_routing_defaults = [
  "AGENTS.md",
  "docs/INDEX.md",
]

[landing]
schema_version = 1
automatic_stale_rebase = false
validation_timeout_seconds = 900

[[handlers]]
id = "python"
kind = "python-overlay-venv"
enabled = true
root_path = ".VE"
worktree_path = ".VE"
script_policy = "root-bin-fallback"

[[handlers]]
id = "blackdog"
kind = "blackdog-runtime"
enabled = true
source_mode = "installed-runtime"
